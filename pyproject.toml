[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-agent"
version = "0.1.0"
description = "Agent development learning workspace"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["agent", "cli", "mcp", "mcp.clients", "mcp.servers", "rag", "skills", "subagent"]
